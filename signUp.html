<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="./logo1.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Lilita+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet" />
</head>

<body>

    <div class="signUp-container">
        <div class="curved-shape"></div>
        <div class="signUp-box">
            <h2>Register</h2>
            <form action="#">
                <div class="input-box">
                    <input id="username" type="text" name="username" placeholder=" " autocomplete="username" required />
                    <label for="username">Username</label>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input id="email" type="email" name="email" placeholder=" " autocomplete="email" required />
                    <label for="email">Email</label>
                    <i class="fa-solid fa-envelope"></i>
                </div>
                <div class="input-box">
                    <input id="password" type="password" name="password" placeholder=" " autocomplete="current-password"
                        required />
                    <label for="password">Password</label>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="input-box">
                    <button type="submit" class="btn">Login</button>
                </div>
                <div class="register-link">
                    <p>
                        Already have an account?
                        <a href="./logIn.html" class="logIn-link">Sign In</a>
                    </p>
                </div>
            </form>
        </div>
        <div class="info-content">
            <h2>Join Us!</h2>
            <p>
                Create an account to explore, see deals, check your orders, and enjoy easy shopping.
            </p>
        </div>
    </div>
</body>

</html>
